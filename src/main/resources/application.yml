server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: geotour-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/geotour}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET_KEY:5f4dcc3b5aa765d61d8327deb882cf995f4dcc3b5aa765d61d8327deb882cf99}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  openweather:
    api-key: ${OPENWEATHER_API_KEY:}
    base-url: ${OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
  cache:
    clima-ttl-minutes: ${CLIMA_CACHE_TTL_MINUTES:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  openapi:
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}
    server-description: ${OPENAPI_SERVER_DESCRIPTION:Servidor local}
  seed:
    admin:
      email: ${ADMIN_EMAIL:admin@geotour.com}
      password: ${ADMIN_PASSWORD:Admin1234!}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  override-with-generic-response: false

logging:
  level:
    com.geotour.api: INFO
    org.springframework.security: INFO
