services:
  postgres:
    image: postgres:16-alpine
    container_name: geotour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geotour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - geotour_pgdata:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geotour"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  geotour_pgdata:
